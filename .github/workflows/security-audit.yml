name: Security Audit & Compliance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-and-dependency-audit:
    name: SAST (Bandit) & CVE Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies and Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit pytest

      - name: Run Bandit Static Application Security Testing (SAST)
        run: |
          # Block on HIGH or CRITICAL severity security vulnerabilities (-ll)
          bandit -r backend/ -ll -i --exclude backend/tests

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          # Audit Python dependencies against known CVE databases
          pip-audit --desc on -r backend/requirements.txt || true

      - name: Run Dedicated Security Verification Test Suite
        run: |
          export PYTHONPATH=.
          pytest backend/tests/test_security_hardened.py -v

      - name: Run Full Regression Test Suite (72+ Tests)
        run: |
          export PYTHONPATH=.
          pytest backend/tests/ -v

  rootless-container-audit:
    name: Rootless Docker Security & User Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: weathergpt:security-audit

      - name: Verify Container Runs as Non-Root User (UID 10001)
        run: |
          USER_NAME=$(docker run --rm weathergpt:security-audit whoami)
          USER_ID=$(docker run --rm weathergpt:security-audit id -u)
          echo "Container running as user: $USER_NAME (UID: $USER_ID)"
          if [ "$USER_NAME" = "root" ] || [ "$USER_ID" = "0" ]; then
            echo "SECURITY VIOLATION: Container must not run as root user!"
            exit 1
          fi
          if [ "$USER_ID" != "10001" ]; then
            echo "SECURITY VIOLATION: Container UID expected 10001, got $USER_ID"
            exit 1
          fi
          echo "CONTAINER HARDENING VERIFIED: Non-root appuser (UID 10001) confirmed."
