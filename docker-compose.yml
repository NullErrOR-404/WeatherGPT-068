version: '3.8'

services:
  weathergpt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathergpt-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
